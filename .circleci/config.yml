version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install AETHRION-LLM from pyproject.toml
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e ".[api,visual,documents,space,data]" pytest
      - run:
          name: Run unit tests
          command: python -m pytest -q

workflows:
  aethrion-ci:
    jobs:
      - build-and-test
