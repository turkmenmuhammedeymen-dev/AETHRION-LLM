version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install AETHRION-LLM from pyproject.toml
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e ".[api,visual,documents,space,data]" pytest
      - run:
          name: Run unit tests
          command: python -m pytest -q

  deploy-to-hugging-face:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Hugging Face deployment client
          command: python -m pip install --upgrade "huggingface-hub>=0.30,<1.0"
      - run:
          name: Stage the latest native AETHRION package
          command: |
            rm -rf hf_space/aethrion
            cp -R aethrion hf_space/aethrion
      - run:
          name: Upload curated Space runtime and latest native package
          command: |
            python -c "import os; from huggingface_hub import HfApi; token=os.environ.get('HF_TOKEN'); assert token, 'HF_TOKEN is missing from the aethrion-deploy CircleCI context'; HfApi(token=token).upload_folder(folder_path='hf_space', repo_id='vizyon2027/AETHRION-LLM', repo_type='space', commit_message='Deploy AETHRION-LLM from CircleCI', ignore_patterns=['README.md', '**/__pycache__/**', '**/*.pyc', '.DS_Store']); print('AETHRION-LLM Space files uploaded successfully.')"

workflows:
  aethrion-ci:
    jobs:
      - build-and-test
      - deploy-to-hugging-face:
          requires:
            - build-and-test
          context:
            - aethrion-deploy
          filters:
            branches:
              only: [main, circleci-project-setup]
