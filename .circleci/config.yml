version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install AETHRION-LLM from pyproject.toml
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e ".[api,visual,documents,space,data]" pytest
      - run:
          name: Run unit tests
          command: python -m pytest -q

  deploy-to-hugging-face:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Hugging Face deployment client
          command: python -m pip install --upgrade "huggingface-hub>=0.30,<1.0"
      - run:
          name: Upload curated Space files
          command: |
            python - <<'PY'
            import os
            from huggingface_hub import HfApi

            token = os.environ.get("HF_TOKEN")
            if not token:
                raise SystemExit("HF_TOKEN is missing from the aethrion-deploy CircleCI context.")

            HfApi(token=token).upload_folder(
                folder_path="hf_space",
                repo_id="vizyon2027/AETHRION-LLM",
                repo_type="space",
                commit_message="Deploy AETHRION-LLM from CircleCI",
                ignore_patterns=["**/__pycache__/**", "**/*.pyc", ".DS_Store"],
            )
            print("AETHRION-LLM Space files uploaded successfully.")
            PY

workflows:
  aethrion-ci:
    jobs:
      - build-and-test
      - deploy-to-hugging-face:
          requires:
            - build-and-test
          context:
            - aethrion-deploy
          filters:
            branches:
              only: main
