version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install AETHRION-LLM and Hugging Face Space runtime dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e ".[api,visual,documents,space,data]" pytest
      - run:
          name: Run unit tests
          command: python -m pytest -q
      - run:
          name: Execute owner-authored intake generator in the repository checkout
          command: |
            set -e
            trap 'rm -rf data/intake' EXIT
            python scripts/create_owner_data_intake.py
            python -c "import json; from pathlib import Path; p=Path('data/intake'); r=json.loads((p/'workspace.json').read_text(encoding='utf-8')); expected={'chat','code','vision','image','asr','tts','vocoder','3d','research','document','safety'}; assert r['model_count']==11, r; assert {x['model_id'] for x in r['models']}==expected; assert r['training_started'] is False; assert r['automatic_approval'] is False; assert all((p/m/'records.jsonl').read_text(encoding='utf-8')=='' for m in expected); assert all((lambda s: s['training_allowed'] is False and s['owner_approval'] is False and s['source_count']==0)(json.loads((p/m/'submission.json').read_text(encoding='utf-8'))) for m in expected); print('PASS: 11 empty, fail-closed intake workspaces generated in CI.')"
      - run:
          name: Run Hugging Face Space runtime smoke tests
          command: python ci/space_smoke.py
      - run:
          name: Audit all eleven native models without starting training
          command: python ci/run_model_family_audit.py --output /tmp/aethrion-model-family-readiness.json
      - store_artifacts:
          path: /tmp/aethrion-model-family-readiness.json
          destination: reports/aethrion-model-family-readiness.json

  deploy-to-hugging-face:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Hugging Face deployment client
          command: python -m pip install --upgrade "huggingface-hub>=0.30,<1.0"
      - run:
          name: Stage the latest native AETHRION package
          command: |
            rm -rf hf_space/aethrion
            cp -R aethrion hf_space/aethrion
      - run:
          name: Stage complete safe project support files
          command: |
            for directory in configs docs tests data ci scripts; do
              rm -rf "hf_space/$directory"
              cp -R "$directory" "hf_space/$directory"
            done
            cp pyproject.toml hf_space/pyproject.toml
            mkdir -p hf_space/models
            cp models/manifest.example.json hf_space/models/manifest.example.json
            cp models/manifest.json hf_space/models/manifest.json
            rm -f hf_space/docs/OWNER_DATA_REVIEW_AUTHORIZATION_2026-11-17.md
            cp README.md hf_space/docs/REPOSITORY_README.md
      - run:
          name: Upload complete AETHRION Space project
          command: |
            python ci/verify_hf_deploy.py

  provision-space-training:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: python -m pip install --upgrade "huggingface-hub>=0.30,<1.0"
      - run:
          name: Create private artifact repo and set Space training settings (idempotent)
          command: python ci/provision_space_training.py

  train-space-pilot:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: python -m pip install --upgrade "huggingface-hub>=0.30,<1.0" gradio_client
      - run:
          name: Run one bounded training session per model on the Space (ZeroGPU)
          command: python ci/trigger_space_training.py --steps 25
          no_output_timeout: 60m

  train-space-complete:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: python -m pip install --upgrade "huggingface-hub>=0.30,<1.0" gradio_client
      - run:
          name: Resume ZeroGPU sessions per model until the configured steps are complete (never a release)
          command: python ci/trigger_space_training.py --until-complete --steps 200 --rounds 40
          no_output_timeout: 120m

  audit-and-evaluate:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install AETHRION-LLM runtime
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e ".[api,visual,documents,space,data]" "huggingface-hub>=0.30,<1.0"
      - run:
          name: Read-only checkpoint audit and held-out evaluation (no training, no push)
          command: python ci/audit_and_evaluate.py --output /tmp/aethrion-specialist-evaluation.json
      - store_artifacts:
          path: /tmp/aethrion-specialist-evaluation.json
          destination: reports/aethrion-specialist-evaluation.json

workflows:
  aethrion-ci:
    jobs:
      - build-and-test
      - deploy-to-hugging-face:
          requires:
            - build-and-test
          context:
            - aethrion-deploy
          filters:
            branches:
              only: [main, circleci-project-setup]
      - provision-space-training:
          requires:
            - deploy-to-hugging-face
          context:
            - aethrion-deploy
          filters:
            branches:
              only: [main]
      - approve-pilot-training:
          type: approval
          requires:
            - provision-space-training
          filters:
            branches:
              only: [main]
      - train-space-pilot:
          requires:
            - approve-pilot-training
          context:
            - aethrion-deploy
          filters:
            branches:
              only: [main]
      - approve-complete-training:
          type: approval
          requires:
            - provision-space-training
          filters:
            branches:
              only: [main]
      - train-space-complete:
          requires:
            - approve-complete-training
          context:
            - aethrion-deploy
          filters:
            branches:
              only: [main]
      - audit-and-evaluate:
          requires:
            - provision-space-training
          context:
            - aethrion-deploy
          filters:
            branches:
              only: [main]
