[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethrion-llm"
version = "0.3.0"
description = "Reliability-hardened from-scratch decoder-only Transformer language model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
visual = ["Pillow>=10"]
dev = ["ruff>=0.4"]
api = ["fastapi>=0.110", "starlette>=0.46,<1.0", "httpx>=0.27", "uvicorn[standard]>=0.27", "pypdf>=5.0", "python-multipart>=0.0.9"]
documents = ["python-docx>=1.1", "reportlab>=4.0"]
space = ["gradio==5.49.1", "spaces==0.52.1", "huggingface-hub>=0.30,<1.0", "python-docx>=1.1", "reportlab>=4.0", "python-multipart>=0.0.9"]
data = ["datasets>=3.0"]

[tool.setuptools.packages.find]
include = ["aethrion*"]

[tool.ruff]
line-length = 100
target-version = "py310"
