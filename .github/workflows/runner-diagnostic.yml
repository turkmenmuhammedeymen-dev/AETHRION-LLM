name: runner-diagnostic
on:
  push:
    branches: ["data/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-probe:
    name: Explicit Ubuntu 24.04 runner assignment probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record runner startup evidence
        run: |
          {
            echo "AETHRION_RUNNER_DIAGNOSTIC_STARTED"
            date -u
            uname -a
            python3 --version
            echo "RUNNER_LABEL=ubuntu-24.04"
            echo "AETHRION_RUNNER_DIAGNOSTIC_COMPLETED"
          } > runner-diagnostic.log 2>&1
          cat runner-diagnostic.log
      - name: Preserve runner diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethrion-runner-diagnostic-${{ github.run_id }}
          path: runner-diagnostic.log
          if-no-files-found: error
