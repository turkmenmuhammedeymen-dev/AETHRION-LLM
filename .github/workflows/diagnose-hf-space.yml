name: Diagnose AETHRION Hugging Face Space
on:
  push:
    branches: ["main", "fix/space-runtime-diagnostics"]
    paths:
      - ".github/workflows/diagnose-hf-space.yml"
      - "hf_space/**"
  workflow_run:
    workflows: ["Deploy AETHRION-LLM to Hugging Face Space"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aethrion-hf-space-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub requests
      - name: Collect Space runtime, restart result, build logs and live HTTP checks
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import requests
          import huggingface_hub
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("HF_TOKEN repository secret is missing.")

          api = HfApi(token=token)
          repo_id = "vizyon2027/AETHRION-LLM"
          url = "https://vizyon2027-aethrion-llm.hf.space"

          print(f"HUGGINGFACE_HUB_VERSION={huggingface_hub.__version__}", flush=True)
          runtime = api.get_space_runtime(repo_id=repo_id)
          stage = str(runtime.stage)
          print(f"SPACE_INITIAL_STAGE={stage}", flush=True)
          print(f"SPACE_HARDWARE={runtime.hardware}", flush=True)
          print(f"SPACE_REQUESTED_HARDWARE={runtime.requested_hardware}", flush=True)
          print(f"SPACE_RUNTIME_RAW={runtime.raw!r}", flush=True)

          # Avoid triggering paid upgraded hardware. A CPU-basic restart is safe to attempt.
          if stage in {"RUNTIME_ERROR", "PAUSED"}:
              if runtime.hardware == "cpu-basic":
                  try:
                      restarted = api.restart_space(repo_id=repo_id, token=token, factory_reboot=False)
                      print(f"SPACE_RESTART_REQUEST=ACCEPTED stage={getattr(restarted, 'stage', 'unknown')}", flush=True)
                  except Exception as exc:
                      message = str(exc).replace(token, "[REDACTED_HF_TOKEN]")
                      print(f"SPACE_RESTART_REQUEST=FAILED type={type(exc).__name__} message={message[:2000]}", flush=True)
              else:
                  print("SPACE_RESTART_REQUEST=SKIPPED reason=hardware_may_be_billable", flush=True)

          for attempt in range(24):
              try:
                  runtime = api.get_space_runtime(repo_id=repo_id)
                  stage = str(runtime.stage)
                  print(f"SPACE_STAGE_ATTEMPT_{attempt + 1}={stage}", flush=True)
                  print(f"SPACE_RUNTIME_RAW_ATTEMPT_{attempt + 1}={runtime.raw!r}", flush=True)
                  if stage in {"RUNNING", "RUNTIME_ERROR", "BUILD_ERROR", "CONFIG_ERROR"}:
                      break
              except Exception as exc:
                  print(f"SPACE_POLL_ERROR={type(exc).__name__}: {str(exc)[:1000]}", flush=True)
              time.sleep(15)

          for label, build in (("BUILD_LOGS", True), ("RUNTIME_LOGS", False)):
              print(f"\n===== {label} =====", flush=True)
              try:
                  lines = list(api.fetch_space_logs(repo_id=repo_id, build=build))
                  if not lines:
                      print("(No log lines returned.)", flush=True)
                  for line in lines[-400:]:
                      print(str(line).replace(token, "[REDACTED_HF_TOKEN]"), end="", flush=True)
              except Exception as exc:
                  message = str(exc).replace(token, "[REDACTED_HF_TOKEN]")
                  print(f"{label}_ERROR={type(exc).__name__}: {message[:2000]}", flush=True)

          print("\n===== HTTP HEALTH CHECK =====", flush=True)
          failed = False
          headers = {"Authorization": f"Bearer {token}"}
          for endpoint in ("/", "/config", "/gradio_api/info"):
              try:
                  response = requests.get(url + endpoint, headers=headers, timeout=30)
                  print(f"SPACE_HTTP_{endpoint}={response.status_code}", flush=True)
                  if response.status_code != 200:
                      failed = True
                      print(response.text[:3000].replace(token, "[REDACTED_HF_TOKEN]"), flush=True)
                      continue
                  if endpoint == "/config":
                      config = response.json()
                      count = len(config.get("components", []))
                      print(f"GRADIO_COMPONENT_COUNT={count}", flush=True)
                      if count < 20:
                          failed = True
                  elif endpoint == "/gradio_api/info":
                      if not isinstance(response.json(), dict):
                          failed = True
                      else:
                          print("GRADIO_API_INFO=PASS", flush=True)
              except Exception as exc:
                  failed = True
                  print(f"SPACE_HTTP_ERROR_{endpoint}={type(exc).__name__}: {str(exc)[:1000]}", flush=True)

          print(f"SPACE_RUNTIME_STAGE_AT_CHECK={stage}", flush=True)
          if failed or stage != "RUNNING":
              raise SystemExit("SPACE_DIAGNOSTICS_FAILED: inspect runtime/build logs above.")
          print("SPACE_RUNTIME_DIAGNOSTICS_OK", flush=True)
          PY
