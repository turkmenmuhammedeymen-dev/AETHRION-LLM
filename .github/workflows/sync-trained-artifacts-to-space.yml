name: Clean unapproved AETHRION checkpoints from Hugging Face Space

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["aethrion"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aethrion-space-artifact-sync
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face client
        run: python -m pip install --upgrade pip huggingface_hub

      - name: Remove only unapproved checkpoints from the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python ci/publish_artifacts_to_space.py
