name: Sync trained AETHRION checkpoints to Hugging Face Space

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["aethrion"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aethrion-space-artifact-sync
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face client
        run: python -m pip install --upgrade pip && python -m pip install -e ".[data]" "huggingface_hub>=0.30,<1.0"

      - name: Rebuild the deterministic, attested Chat tokenizer
        env:
          AETHRION_BASE_AUDIT_HMAC_KEY: ${{ secrets.AETHRION_BASE_AUDIT_HMAC_KEY }}
        run: python scripts/prepare_base.py --force

      - name: Publish verified checkpoints and tokenizer files to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AETHRION_BASE_AUDIT_HMAC_KEY: ${{ secrets.AETHRION_BASE_AUDIT_HMAC_KEY }}
        run: python ci/publish_artifacts_to_space.py
