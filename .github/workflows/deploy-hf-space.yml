name: Deploy AETHRION-LLM to Hugging Face Space
on:
  workflow_dispatch:
  push:
    branches: ["main", "hardening/training-approval-gate"]
    paths:
      - "hf_space/**"
      - ".github/workflows/deploy-hf-space.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade huggingface_hub
      - name: Upload Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("Missing HF_TOKEN repository secret.")

          repo_id = "vizyon2027/AETHRION-LLM"
          api = HfApi(token=token)

          # This app does not currently declare any @spaces.GPU entrypoint.
          # Keep it on free CPU Basic rather than requesting/billing GPU hardware.
          runtime = api.get_space_runtime(repo_id=repo_id)
          print(f"SPACE_HARDWARE_BEFORE={runtime.hardware}")
          print(f"SPACE_REQUESTED_HARDWARE_BEFORE={runtime.requested_hardware}")
          if runtime.requested_hardware != "cpu-basic":
              api.request_space_hardware(repo_id=repo_id, hardware="cpu-basic")
              print("SPACE_HARDWARE_REQUESTED=cpu-basic")
          else:
              print("SPACE_HARDWARE_ALREADY=cpu-basic")

          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="hf_space",
              commit_message="Deploy tested AETHRION-LLM CPU-safe Space",
          )
          print("Space upload completed.")
          PY
