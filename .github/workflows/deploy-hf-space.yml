name: Deploy AETHRION-LLM to Hugging Face Space
on:
  workflow_dispatch:
  push:
    branches: ["main", "hardening/training-approval-gate"]
    paths:
      - "hf_space/**"
      - ".github/workflows/deploy-hf-space.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade huggingface_hub
      - name: Upload Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("Missing HF_TOKEN repository secret.")

          repo_id = "vizyon2027/AETHRION-LLM"
          api = HfApi(token=token)

          # Keep the Space's existing ZeroGPU hardware. The app now has a
          # registered @spaces.GPU handler, but no GPU is allocated unless the
          # authenticated local AETHRION checkpoint is actually used.
          runtime = api.get_space_runtime(repo_id=repo_id)
          print(f"SPACE_HARDWARE_BEFORE={runtime.hardware}")
          print(f"SPACE_REQUESTED_HARDWARE_BEFORE={runtime.requested_hardware}")
          if runtime.requested_hardware == "zero-a10g":
              print("SPACE_HARDWARE_RETAINED=zero-a10g; no paid hardware change requested.")
          else:
              print("SPACE_HARDWARE_UNCHANGED")

          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="hf_space",
              commit_message="Deploy ZeroGPU-compatible AETHRION-LLM Space",
          )
          print("Space upload completed.")
          PY
