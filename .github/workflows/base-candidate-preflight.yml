name: AETHRION BASE Candidate Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "data/authored/base/**"
      - "data/authored/chat/**"
      - "scripts/prepare_base_candidate.py"
      - "scripts/prepare_base_chat_candidate.py"
      - "tests/test_base_candidate_preparation.py"
      - "tests/test_base_chat_candidate.py"
      - ".github/workflows/base-candidate-preflight.yml"
  push:
    branches: [main]
    paths:
      - "data/authored/base/**"
      - "data/authored/chat/**"
      - "scripts/prepare_base_candidate.py"
      - "scripts/prepare_base_chat_candidate.py"
      - "tests/test_base_candidate_preparation.py"
      - "tests/test_base_chat_candidate.py"
      - ".github/workflows/base-candidate-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and private Hub upload dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install "huggingface-hub>=0.30,<1.0" "numpy>=1.24"
      - name: Validate candidate preparation
        run: python -m pytest -q tests/test_base_candidate_preparation.py tests/test_base_chat_candidate.py
      - name: Build non-training BASE candidate
        run: python scripts/prepare_base_candidate.py
      - name: Build BASE tokenizer and CHAT instruction candidate with approvals disabled
        run: python scripts/prepare_base_chat_candidate.py
      - name: Store non-training candidate in the private HF artifact repository
        if: github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("HF_TOKEN is required for the main-branch private candidate upload.")
          repo_id = "vizyon2027/aethrion-artifacts"
          api = HfApi(token=token)
          info = api.repo_info(repo_id=repo_id, repo_type="model")
          if not getattr(info, "private", False):
              raise SystemExit("Refusing to upload candidate data: artifact repository must remain private.")
          sha = os.environ["SOURCE_SHA"]
          base_commit = api.upload_folder(
              repo_id=repo_id,
              repo_type="model",
              folder_path="data/processed/base_candidate",
              path_in_repo=f"candidates/base/{sha}",
              ignore_patterns=["chat_candidate/**"],
              commit_message=f"Store unapproved BASE candidate {sha[:12]}",
          )
          print(f"PRIVATE_BASE_CANDIDATE_UPLOAD=PASS revision={base_commit.oid}")
          chat_commit = api.upload_folder(
              repo_id=repo_id,
              repo_type="model",
              folder_path="data/processed/base_candidate/chat_candidate",
              path_in_repo=f"candidates/chat/{sha}",
              commit_message=f"Store unapproved CHAT candidate {sha[:12]}",
          )
          print(f"PRIVATE_CHAT_CANDIDATE_UPLOAD=PASS revision={chat_commit.oid}")
          PY
      - name: Upload candidate and audit manifest to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: aethrion-base-chat-candidate-preflight
          path: data/processed/base_candidate/
          if-no-files-found: error
          retention-days: 14
