name: AETHRION Specialist CPU Training

on:
  workflow_run:
    workflows: ["aethrion"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aethrion-specialist-training-artifacts
  cancel-in-progress: false

jobs:
  train-specialists:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, '[train-specialists]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out the exact CI-verified source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AETHRION training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,visual,documents,space,data]" "huggingface-hub>=0.30,<1.0"
      - name: Run bounded, resumable specialist training on the public CPU runner
        run: |
          test -n "$HF_TOKEN"
          python -u ci/train_on_runner.py \
            --steps 250 \
            --max-rounds 60 \
            --session-timeout 1500 \
            --deadline-minutes 330 \
            --report aethrion-specialist-training-summary.json \
            --models code research safety vision image asr tts vocoder 3d document
      - name: Upload training summary (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethrion-specialist-training-summary
          path: aethrion-specialist-training-summary.json
          if-no-files-found: warn
