name: tests
on:
  push:
    branches: ["main", "hardening/**", "feature/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: aethrion-llm-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} / CPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24"
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end smoke test
        run: python -m aethrion.smoke_test
