name: tests
on:
  push:
    branches: ["main", "hardening/**", "feature/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: aethrion-llm-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} / CPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24"
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[api]"
      - name: Space application syntax checks
        run: python -m compileall -q hf_space/app.py hf_space/aethrion
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end smoke test
        run: python -m aethrion.smoke_test

  space-runtime:
    name: Hugging Face Space runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24"
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - name: Install Space dependencies
        run: |
          grep -v -E '^torch([<=>]|$)' hf_space/requirements.txt > /tmp/space-requirements.txt
          python -m pip install -r /tmp/space-requirements.txt
          python -m pip install "gradio[oauth,mcp]==5.49.1" "spaces==0.51.3"
          python -m pip check
      - name: Import and construct the actual Space UI
        working-directory: hf_space
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          import gradio as gr
          import app

          assert isinstance(app.demo, gr.Blocks), "Gradio Blocks UI was not constructed"
          config = app.demo.get_config_file()
          assert isinstance(config, dict) and config.get("components"), "Gradio UI config is empty"
          assert len(config["components"]) >= 20, "Expected all Space tabs and controls in UI config"
          api_info = app.demo.get_api_info()
          assert isinstance(api_info, dict), "Gradio API schema generation failed"

          status = app.status()
          for capability in ("chat", "code", "image", "3d", "research", "file_analysis", "audio"):
              assert capability in status, f"Missing capability status: {capability}"

          assert "checkpoint/tokenizer" in app.chat("hello", [] ).lower()
          assert "configure" in app.code("write a function").lower()
          assert "configure" in app.research("latest AI research").lower()
          assert "configure" in app.three_d_text("a small tree")[0].lower()
          assert "configure" in app.analyse(None, "summarize").lower()
          assert "configure" in app.voice(None)[0].lower()

          with tempfile.TemporaryDirectory() as temp:
              created = app.make_doc("AETHRION smoke test", "first paragraph\n\nsecond paragraph", "docx")
              extracted = app.extract_doc(created)
              assert "first paragraph" in extracted and "second paragraph" in extracted
              message, edited = app.edit_doc(created, "first paragraph", "updated paragraph", "docx")
              assert edited and "created" in message.lower()
              edited_text = app.extract_doc(edited)
              assert "updated paragraph" in edited_text
              Path(created).unlink(missing_ok=True)
              Path(edited).unlink(missing_ok=True)

          print("SPACE_RUNTIME_SMOKE_TEST_OK")
          PY
      - name: Launch Space and verify live Gradio endpoints
        working-directory: hf_space
        env:
          PYTHONPATH: .
          PORT: "7860"
        run: |
          set -euo pipefail
          python app.py > /tmp/aethrion-space.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for endpoint in / /config /gradio_api/info; do
            ready=0
            for attempt in $(seq 1 10); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat /tmp/aethrion-space.log
                echo "Space app process exited while waiting for $endpoint."
                exit 1
              fi
              code=$(curl --connect-timeout 2 --max-time 4 --silent --show-error -o /tmp/aethrion-response.json -w "%{http_code}" "http://127.0.0.1:7860$endpoint" || true)
              if [ "$code" = "200" ]; then
                ready=1
                case "$endpoint" in
                  /) cp /tmp/aethrion-response.json /tmp/aethrion-root.html ;;
                  /config) cp /tmp/aethrion-response.json /tmp/aethrion-config.json ;;
                  /gradio_api/info) cp /tmp/aethrion-response.json /tmp/aethrion-info.json ;;
                esac
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Endpoint $endpoint returned HTTP $code."
              echo "Response body:"
              cat /tmp/aethrion-response.json 2>/dev/null || true
              echo "Application log:"
              cat /tmp/aethrion-space.log
              exit 1
            fi
          done
          python - <<'PY'
          import json
          with open("/tmp/aethrion-config.json", encoding="utf-8") as handle:
              config = json.load(handle)
          with open("/tmp/aethrion-info.json", encoding="utf-8") as handle:
              info = json.load(handle)
          assert len(config.get("components", [])) >= 20, "Live config is missing UI components"
          assert isinstance(info, dict), "Live /gradio_api/info response is not a JSON object"
          print(f"LIVE_CONFIG_COMPONENTS={len(config['components'])}")
          print("LIVE_INFO_ENDPOINT=PASS")
          PY
          echo "SPACE_LIVE_SERVER_TEST_OK"
