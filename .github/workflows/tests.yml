name: tests

on:
  push:
    branches: ["main", "bootstrap/**"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "torch>=2.2"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
